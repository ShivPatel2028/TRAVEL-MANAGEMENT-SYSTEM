<div class="travel-request-container">
  <div class="header">
    <button mat-button (click)="goBack()">← Back</button>
    <h2>Create Travel Request</h2>
  </div>

  <mat-card class="form-card">
    <mat-card-content>
      <form [formGroup]="travelForm" (ngSubmit)="onSubmit()">
        <div *ngIf="error" class="error-message">{{ error }}</div>
        <div *ngIf="success" class="success-message">{{ success }}</div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>From Location</mat-label>
          <input matInput formControlName="fromLocation" placeholder="Enter starting location">
          <mat-error *ngIf="f['fromLocation'].hasError('required')">From location is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>To Location</mat-label>
          <input matInput formControlName="toLocation" placeholder="Enter destination">
          <mat-error *ngIf="f['toLocation'].hasError('required')">To location is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Travel Date</mat-label>
          <input matInput [matDatepicker]="startPicker" formControlName="travelDate">
          <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
          <mat-error *ngIf="f['travelDate'].hasError('required')">Travel date is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Return Date</mat-label>
          <input matInput [matDatepicker]="endPicker" formControlName="returnDate">
          <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
          <mat-error *ngIf="f['returnDate'].hasError('required')">Return date is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Purpose</mat-label>
          <textarea matInput formControlName="purpose" placeholder="Enter purpose of travel" rows="4"></textarea>
          <mat-error *ngIf="f['purpose'].hasError('required')">Purpose is required</mat-error>
          <mat-error *ngIf="f['purpose'].hasError('minlength')">Purpose must be at least 10 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Requested Budget</mat-label>
          <input matInput type="number" formControlName="requestedBudget">
          <mat-error *ngIf="f['requestedBudget'].hasError('required')">Budget is required</mat-error>
        </mat-form-field>

        <div class="button-group">
          <button mat-raised-button color="primary" [disabled]="loading">
            {{ loading ? 'Creating...' : 'Create Request' }}
          </button>
          <button mat-button (click)="goBack()">Cancel</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
