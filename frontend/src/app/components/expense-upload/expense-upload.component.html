<h2 mat-dialog-title>Submit Travel Bill</h2>
<mat-dialog-content>
  <form [formGroup]="expenseForm" (ngSubmit)="onSubmit()">
    <div *ngIf="error" class="error-message mb-2">{{ error }}</div>

    <div formArrayName="expenses">
      <div *ngFor="let expense of expenses.controls; let i = index" [formGroupName]="i" class="expense-item">
        <div class="expense-header">
          <h3>Expense {{i + 1}}</h3>
          <button mat-icon-button color="warn" type="button" (click)="removeExpense(i)" *ngIf="expenses.length > 1">
            <mat-icon>delete</mat-icon>
          </button>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Expense Type</mat-label>
          <mat-select formControlName="type" required>
            <mat-option value="Hotel">Hotel</mat-option>
            <mat-option value="Food">Food</mat-option>
            <mat-option value="Transport">Transport</mat-option>
            <mat-option value="Other">Other</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Amount</mat-label>
          <input matInput type="number" formControlName="amount" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Date</mat-label>
          <input matInput [matDatepicker]="expensePicker" formControlName="date" required>
          <mat-datepicker-toggle matSuffix [for]="expensePicker"></mat-datepicker-toggle>
          <mat-datepicker #expensePicker></mat-datepicker>
        </mat-form-field>
      </div>
    </div>

    <button mat-stroked-button color="primary" type="button" (click)="addExpense()" class="add-btn mb-3">
      + Add Another Expense
    </button>

    <div class="file-input-container mb-3">
      <label class="d-block mb-1">Upload Receipts (PDF/JPG/PNG):</label>
      <input type="file" multiple (change)="onFileChange($event)" accept=".pdf,.jpg,.jpeg,.png" required>
    </div>

    <div class="actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="loading || expenseForm.invalid || selectedFiles.length === 0">
        {{ loading ? 'Submitting...' : 'Submit Bills' }}
      </button>
      <button mat-button type="button" (click)="onCancel()" [disabled]="loading">Cancel</button>
    </div>
  </form>
</mat-dialog-content>
